    const gap=$("head-mode").value==="gap";for(const [id,hidden] of [["sill",door],["oh",$("head-mode").value!=="height"],["head-gap",!gap],["swing",!door],["hinge",!door||$("swing").value==="unknown"],["to",!door]]){$(id).closest("label").hidden=hidden;$(id).disabled=hidden}
    $("head-gap").required=gap;
    const ref=!door&&o.ref==="closet"&&+$("owall").value===2;
    $("off").labels[0].firstChild.textContent=(ref?"Gap from closet face":"Offset from wall start")+" ("+unitLabel()+")";
    $("offset-note").textContent=(ref?"Measure rightward from the open closet edge to the left window jamb. "+(o.rightMargin!=null?"Width is inferred; enter a different width to fix it to a measurement. ":""):"Measure from "+ends[+$("owall").value]+", to the near edge. ")+"Wall length: "+fmt(wallLength(r,+$("owall").value))+"."+(gap&&r.h==null?" Opening height can be calculated once ceiling height is known.":"")+($("head-mode").value==="match"?" The door top follows the main window.":"")}
  for(const id of ["ot","owall","swing","head-mode"])$(id).onchange=toggle;toggle();
  if(existing){$("remove-op").onclick=()=>{change(()=>r.openings=r.openings.filter(a=>a.id!==o.id));close()};if(o.to)$("visit").onclick=()=>goRoom(o.to)}
}
function customForm(){
  form("Add furniture",nameField("")+lengthField("cw","Length",null)+lengthField("cd","Width",null)+lengthField("ch","Height",null),
  "Measure the outside edges. Length runs left to right before rotation. Saving adds a reusable piece to your gallery; drag or click its card to place a copy.","Save to gallery",()=>{
    const s={id:uid(),name:readName(),kind:"block",w:lengthOf("cw"),d:lengthOf("cd"),h:lengthOf("ch")};
    change(()=>{plan.catalog.unshift(s);tab="gallery"});close();notify(s.name+" saved to your gallery.");
  });
}
function positionForm(){
  const p=piece();if(!p)return;const s=spec(p.type);
  form(s.name,lengthField("px","Center from left wall",p.x)+lengthField("py","Center from top wall",p.y)+selectField("rot","Rotation",[0,90,180,270].map(a=>[a,a+"\u00b0"]),p.rot),
    "Footprint: "+dims(s.w,s.d)+"; height: "+fmt(s.h)+". Position uses the center of the piece and does not snap.","Save position",()=>{
      const x=lengthOf("px",true),y=lengthOf("py",true),rot=+$("rot").value;if(!fits(room(),s,rot,x,y))throw Error("That position would cross a wall or a fixed partition.");
      change(()=>Object.assign(p,{x,y,rot}));close();
    });
}
$("guide").onclick=()=>modal("Controls & measuring guide",`<p class="help"><b>B</b> opens Build. Drag the scene to orbit; scroll to zoom; Shift-drag to pan. On touch screens use the zoom buttons under View. <b>F</b> fits the room. Use Rooms &amp; places for close-ups.</p><p class="help">In <b>Place furniture</b>, save a name, length, width and height to your gallery. Drag a card onto the room floor, or tap to place. Select a piece to rotate or position it precisely.</p><p class="help">The plan origin is top left. Wall offsets run clockwise except the bedroom window gap, which starts at the closet face. Enter actual dimensions under View &amp; measurements. Fixtures and finishes are illustrative; the closet estimates can be changed under Built-ins &amp; sketch.</p><p class="help">Edits are saved in this browser when storage is available. Build &rarr; Save HTML copy keeps every room, piece and camera position together offline.</p>`);
$("section-edit").onclick=sectionForm;$("measure").onclick=()=>roomForm(false);$("rooms").onclick=roomsMenu;$("custom").onclick=customForm;$("edit-piece").onclick=positionForm;
$("height-notes").onclick=()=>{
  const r=room(),H=previewCeiling(r);modal("3D height notes",`<p class="help">${r.h==null?`No ceiling height was supplied. The model uses <b>${fmt(H)}</b> as a visual reference only. Set the real height in <b>Measurements</b>.`:`The walls use the measured ceiling height of <b>${fmt(H)}</b>.`}</p>
  ${r.section?`<p class="help">${r.suite?`Bathroom walls and galley cabinetry reach the ceiling. The shared wall is shown 4&Prime; thick; fixture sizes and worktop height are illustrative. Closet depth is ${fmt(closetDepth(r))}; its ${fmt(r.d-pocketY(r))} run follows the left wall behind the pocket divider. The front is open. The fridge nook stays empty unless you place an appliance.`:r.section.height==null?`The partitions are shown at <b>${fmt(Math.min(36,H))}</b>.`:`Partition height: <b>${fmt(r.section.height)}</b>.`}</p>`:""}
  <p class="help">Windows use their recorded sill and opening height, or their gap below the ceiling. The sketched entry defaults to the main window's top; the bathroom door defaults to 80&Prime; high in the indicated passage. Door leaves are shown closed. If no upper measurement is known, the opening extends to the wall top.</p>
  <p class="help">Custom furniture uses its gallery dimensions. Studio props and built-in fixture details are illustrative rather than surveyed.</p>`);
};
function snapshotHTML(){const doc=baseHTML.cloneNode(true);
  doc.querySelector("#snapshot").textContent=JSON.stringify({copyId:uid(),plan,viewer}).replace(/</g,"\\u003c");
  return "<!doctype html>\n"+doc.outerHTML;
}
$("download").onclick=()=>{const blob=new Blob([snapshotHTML()],{type:"text/html;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=(room().name.replace(/[^A-Za-z0-9_-]+/g,"-").replace(/^-+|-+$/g,"").toLowerCase()||"room")+"-plan.html";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);notify("HTML copy prepared with all rooms and furniture.")};
document.addEventListener("keydown",e=>{if(dlg.open||drag||gesture||/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName))return;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="z"&&!e.shiftKey){e.preventDefault();undo()}
  else if(!e.metaKey&&!e.ctrlKey&&!e.altKey&&e.key.toLowerCase()==="b"){e.preventDefault();tools($("tray").hidden?"home":null,true)}
  else if(!e.metaKey&&!e.ctrlKey&&!e.altKey&&e.key.toLowerCase()==="f"&&in3D()){$("camera-fit").click();tools(null)}
  else if(e.key==="Escape"){if(!$("tray").hidden)tools(null,true);else{selection=null;render()}}
});
render();
if(loadIssue){$("status").textContent="Use Save HTML copy";$("status").classList.add("bad");notify(loadIssue)}
else if(embedded)$("status").textContent="Offline copy";
</script></body></html>
